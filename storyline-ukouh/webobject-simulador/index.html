<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de altura · Santuario de Ukouh</title>
<style>
  /* Paleta de la sábana: crema, tinta, amarillo, cian, magenta */
  :root { --crema:#FAF8F2; --tinta:#1E293B; --amarillo:#FEF08A; --cian:#A5F3FC; --magenta:#FBCFE8; --verde:#BBF7D0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--crema); color:var(--tinta);
    font-family: "Segoe UI", "Montserrat", system-ui, sans-serif; overflow:hidden; }
  #app { position:relative; width:100%; height:100%; display:flex; flex-direction:column; }
  canvas { flex:1; width:100%; display:block; }
  .controles { display:flex; align-items:center; gap:14px; padding:10px 18px; border-top:2px dashed #cbd5e1; flex-wrap:wrap; }
  .controles label { font-weight:700; }
  input[type=range] { flex:1; min-width:180px; accent-color:#db2777; height:28px; }
  .valor { min-width:72px; font-weight:800; background:var(--magenta); padding:4px 10px; border-radius:6px; text-align:center; }
  button { font:inherit; font-weight:700; padding:10px 18px; border:2px solid var(--tinta); border-radius:8px;
    background:var(--amarillo); color:var(--tinta); cursor:pointer; box-shadow:3px 3px 0 var(--tinta); }
  button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--tinta); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:3px solid #0891b2; outline-offset:2px; }
  /* Bloqueo "primero predice" (los Web Objects quedan siempre encima en Storyline) */
  #bloqueo { position:absolute; inset:0; background:rgba(250,248,242,.93); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; transition:opacity .5s; }
  #bloqueo.oculto { opacity:0; pointer-events:none; }
  #bloqueo .candado { font-size:44px; }
  #bloqueo p { margin:0; font-size:18px; font-weight:700; max-width:420px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="lienzo" aria-label="Simulador: triángulo rectángulo con base de 6 metros y altura variable"></canvas>
  <div class="controles">
    <label for="altura">Altura b:</label>
    <input id="altura" type="range" min="0" max="14" step="0.5" value="8" aria-describedby="valorAltura">
    <span class="valor" id="valorAltura" aria-live="polite">8 m</span>
    <button id="probar">▶ Probar puente y cruce</button>
  </div>
  <div id="bloqueo" role="status">
    <div class="candado">🔒</div>
    <p>Primero haz tu predicción: si la altura sube a 12 m, ¿la plataforma de 10 m seguirá alcanzando?</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  // ------------------------------------------------------------------
  // Constantes del problema
  // ------------------------------------------------------------------
  const BASE = 6;           // separación horizontal fija (m)
  const PLATAFORMA = 10;    // tablón de Link (m)
  const COL = { crema:'#FAF8F2', tinta:'#1E293B', amarillo:'#FACC15', amarilloSuave:'#FEF08A',
                cian:'#06B6D4', cianSuave:'#A5F3FC', magenta:'#DB2777', magentaSuave:'#FBCFE8',
                verde:'#16A34A', verdeSuave:'#BBF7D0', madera:'#A16207', gris:'#CBD5E1' };

  const lienzo = document.getElementById('lienzo');
  const ctx = lienzo.getContext('2d');
  const slider = document.getElementById('altura');
  const valorTxt = document.getElementById('valorAltura');
  const btnProbar = document.getElementById('probar');
  const bloqueo = document.getElementById('bloqueo');

  let b = Number(slider.value);   // altura actual
  let anim = null;                // estado de la animación de cruce
  let W = 0, H = 0, dpr = 1;

  // Dentro de Storyline arranca bloqueado; abierto directamente en navegador, libre.
  const enStoryline = window.parent !== window;
  if (!enStoryline) bloqueo.classList.add('oculto');

  // ------------------------------------------------------------------
  // Comunicación con Storyline
  // ------------------------------------------------------------------
  function enviar(datos) {
    if (!enStoryline) return;
    window.parent.postMessage(Object.assign({ fuente: 'ukouh-sim' }, datos), '*');
  }
  window.addEventListener('message', ev => {
    const d = ev.data;
    if (!d || d.fuente !== 'ukouh-storyline') return;
    if (d.tipo === 'habilitar') bloqueo.classList.add('oculto');
    if (d.tipo === 'bloquear') bloqueo.classList.remove('oculto');
    if (d.tipo === 'altura') fijarAltura(Number(d.valor), false);
  });

  function fijarAltura(v, avisar) {
    v = Math.max(0, Math.min(14, isNaN(v) ? 8 : v));
    if (v === b && Number(slider.value) === v) return;
    b = v;
    slider.value = v;
    valorTxt.textContent = fmt(v, v % 1 ? 1 : 0) + ' m';
    anim = null;
    btnProbar.disabled = false;
    if (avisar) enviar({ tipo: 'altura', valor: v });
  }

  slider.addEventListener('input', () => fijarAltura(Number(slider.value), true));

  // ------------------------------------------------------------------
  // Utilidades
  // ------------------------------------------------------------------
  const fmt = (n, d = 2) => Number(n).toFixed(d);
  const hip = h => Math.sqrt(BASE * BASE + h * h);
  const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function ajustarTamano() {
    dpr = window.devicePixelRatio || 1;
    const r = lienzo.getBoundingClientRect();
    W = r.width; H = r.height;
    lienzo.width = Math.round(W * dpr);
    lienzo.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', ajustarTamano);

  // Geometría en pantalla: escala para que quepan 14 m de alto
  function geo() {
    const zonaDibujo = W * 0.55;
    const ppm = Math.min((H - 70) / 15.5, (zonaDibujo - 120) / (BASE + 4));   // píxeles por metro
    const x0 = Math.max(90, zonaDibujo * 0.32);   // borde de la plataforma izquierda
    const y0 = H - 40;                            // nivel de la plataforma izquierda
    return { ppm, x0, y0, x1: x0 + BASE * ppm, panel: zonaDibujo + 10 };
  }

  // ------------------------------------------------------------------
  // Dibujo
  // ------------------------------------------------------------------
  function cuadricula() {
    ctx.fillStyle = COL.crema; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#E7E2D3'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 18) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 18) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
  }

  function plataformas(g, yTop) {
    ctx.fillStyle = '#E2E8F0'; ctx.strokeStyle = COL.tinta; ctx.lineWidth = 2;
    // Izquierda
    ctx.beginPath(); ctx.rect(g.x0 - 90, g.y0, 90, H - g.y0 + 2); ctx.fill(); ctx.stroke();
    // Derecha (sube con la altura)
    ctx.beginPath(); ctx.rect(g.x1, yTop, 90, H - yTop + 2); ctx.fill(); ctx.stroke();
    // Rayado tipo boceto
    ctx.save(); ctx.beginPath(); ctx.rect(g.x1, yTop, 90, H - yTop); ctx.clip();
    ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      ctx.beginPath(); ctx.moveTo(g.x1 + i * 12, yTop); ctx.lineTo(g.x1 + i * 12 - 40, yTop + 40); ctx.stroke();
    }
    ctx.restore();
  }

  function linea(x1, y1, x2, y2, color, ancho, guiones) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineCap = 'round';
    if (guiones) ctx.setLineDash(guiones);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
  }

  function etiqueta(texto, x, y, fondo) {
    ctx.save(); ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    const w = ctx.measureText(texto).width + 12;
    ctx.fillStyle = fondo; ctx.fillRect(x - w / 2, y - 12, w, 24);
    ctx.strokeStyle = COL.tinta; ctx.lineWidth = 1; ctx.strokeRect(x - w / 2, y - 12, w, 24);
    ctx.fillStyle = COL.tinta; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(texto, x, y + 1);
    ctx.restore();
  }

  // Link en versión "palito"
  function stickLink(x, y, fase, alerta) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = COL.tinta; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    const paso = Math.sin(fase) * 6;
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(paso, 0); ctx.moveTo(0, -14); ctx.lineTo(-paso, 0); ctx.stroke(); // piernas
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, -32); ctx.stroke();                                         // cuerpo
    ctx.beginPath(); ctx.moveTo(0, -27); ctx.lineTo(-paso, -18); ctx.moveTo(0, -27); ctx.lineTo(paso, -18); ctx.stroke(); // brazos
    ctx.fillStyle = '#FDE68A'; ctx.beginPath(); ctx.arc(0, -39, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();      // cabeza
    ctx.fillStyle = COL.verde; ctx.beginPath(); ctx.moveTo(-7, -42); ctx.lineTo(10, -46); ctx.lineTo(-4, -50); ctx.fill(); // gorro verde
    if (alerta) { ctx.fillStyle = COL.magenta; ctx.font = '900 20px system-ui'; ctx.fillText('!', 10, -50); }
    ctx.restore();
  }

  function panel(g, c) {
    const x = g.panel, alcanza = c <= PLATAFORMA + 1e-9;
    ctx.save();
    ctx.fillStyle = COL.tinta; ctx.textBaseline = 'top';
    ctx.font = '800 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Bitácora de cálculo', x, 18);
    ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
    const lineas = [
      ['a = 6 m (fija)', COL.cianSuave],
      [`b = ${fmt(b, b % 1 ? 1 : 0)} m`, COL.magentaSuave],
      [`c² = 6² + ${fmt(b, b % 1 ? 1 : 0)}² = 36 + ${fmt(b * b, (b * b) % 1 ? 2 : 0)} = ${fmt(36 + b * b, (b * b) % 1 ? 2 : 0)}`, null],
      [`c = √${fmt(36 + b * b, (b * b) % 1 ? 2 : 0)} ≈ ${fmt(c)} m`, COL.amarilloSuave]
    ];
    lineas.forEach(([t, fondo], i) => {
      const y = 52 + i * 30;
      if (fondo) { ctx.fillStyle = fondo; ctx.fillRect(x - 4, y - 3, ctx.measureText(t).width + 8, 24); }
      ctx.fillStyle = COL.tinta; ctx.fillText(t, x, y);
    });

    // Banner de estado
    const yB = 180;
    ctx.fillStyle = alcanza ? COL.verdeSuave : COL.magentaSuave;
    ctx.strokeStyle = alcanza ? COL.verde : COL.magenta; ctx.lineWidth = 2;
    ctx.fillRect(x - 4, yB, W - x - 16, 44); ctx.strokeRect(x - 4, yB, W - x - 16, 44);
    ctx.fillStyle = COL.tinta; ctx.font = '800 15px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(alcanza ? `✔ El tablón de 10 m alcanza` : `✖ No alcanza: faltan ${fmt(c - PLATAFORMA)} m`, x + 6, yB + 13);

    // Geometría analítica
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Distancia entre dos puntos:', x, 244);
    ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`d = √((x₂−x₁)² + (y₂−y₁)²)`, x, 266);
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`P₁(0, 0)  P₂(6, ${fmt(b, b % 1 ? 1 : 0)})  →  d ≈ ${fmt(c)} m`, x, 288);

    // Nota no lineal
    ctx.fillStyle = '#475569'; ctx.font = 'italic 13px "Segoe UI", system-ui, sans-serif';
    envolver('Duplicar la altura no duplica la hipotenusa: los lados se relacionan mediante sus cuadrados.', x, 318, W - x - 20, 18);
    ctx.restore();
  }

  function envolver(texto, x, y, ancho, alto) {
    const palabras = texto.split(' '); let linea = '';
    palabras.forEach(p => {
      const prueba = linea + p + ' ';
      if (ctx.measureText(prueba).width > ancho && linea) { ctx.fillText(linea, x, y); linea = p + ' '; y += alto; }
      else linea = prueba;
    });
    ctx.fillText(linea, x, y);
  }

  function dibujar(ahora) {
    if (!W) ajustarTamano();
    const g = geo();
    const c = hip(b);
    const yTop = g.y0 - b * g.ppm;

    cuadricula();
    plataformas(g, yTop);

    // Catetos y ángulo recto
    linea(g.x0, g.y0, g.x1, g.y0, COL.cian, 4, [8, 6]);
    linea(g.x1, g.y0, g.x1, yTop, COL.magenta, 4, [8, 6]);
    if (b > 0.4) {
      ctx.save(); ctx.strokeStyle = COL.tinta; ctx.lineWidth = 1.5;
      ctx.strokeRect(g.x1 - 14, g.y0 - 14, 14, 14); ctx.restore();
    }
    // Hipotenusa
    linea(g.x0, g.y0, g.x1, yTop, COL.amarillo, 5);

    etiqueta('a = 6 m', (g.x0 + g.x1) / 2, g.y0 + 18, COL.cianSuave);
    etiqueta(`b = ${fmt(b, b % 1 ? 1 : 0)} m`, g.x1 + 50, (g.y0 + yTop) / 2, COL.magentaSuave);
    etiqueta(`c ≈ ${fmt(c)} m`, (g.x0 + g.x1) / 2 - 34, (g.y0 + yTop) / 2 - 8, COL.amarilloSuave);

    // Animación de cruce
    const ang = Math.atan2(g.y0 - yTop, BASE * g.ppm);   // inclinación hacia la plataforma
    if (anim) {
      const t = (ahora - anim.t0);
      // 1) el tablón gira desde vertical hasta la inclinación (900 ms)
      const pGiro = Math.min(1, t / 900);
      const angTablon = Math.PI / 2 + (ang - Math.PI / 2) * easeInOut(pGiro);
      const largo = PLATAFORMA * g.ppm;
      const xf = g.x0 + Math.cos(angTablon) * largo, yf = g.y0 - Math.sin(angTablon) * largo;
      linea(g.x0, g.y0, xf, yf, COL.madera, 9);
      linea(g.x0, g.y0, xf, yf, '#CA8A04', 3);

      // 2) Link camina sobre el tablón
      const metaM = Math.min(c, PLATAFORMA);                     // hasta dónde puede llegar
      const durCam = metaM * 260;
      const tc = Math.max(0, t - 1000);
      const pCam = Math.min(1, tc / durCam);
      const d = metaM * g.ppm * easeInOut(pCam);
      const lx = g.x0 + Math.cos(ang) * d, ly = g.y0 - Math.sin(ang) * d;
      const termino = pCam >= 1 && pGiro >= 1;
      stickLink(lx, ly - 2, tc / 90, termino && !anim.alcanza);

      if (termino) {
        if (!anim.avisado) { anim.avisado = true; enviar({ tipo: 'cruce', alcanza: anim.alcanza, altura: b, c: Number(fmt(c)) }); btnProbar.disabled = false; }
        etiqueta(anim.alcanza ? '¡Cruce exitoso!' : `¡Faltan ${fmt(c - PLATAFORMA)} m!`,
          lx, ly - 70, anim.alcanza ? COL.verdeSuave : COL.magentaSuave);
      }
    } else {
      stickLink(g.x0 - 30, g.y0 - 2, 0, false);   // Link espera en el borde
    }

    panel(g, c);
    requestAnimationFrame(dibujar);
  }

  btnProbar.addEventListener('click', () => {
    btnProbar.disabled = true;
    anim = { t0: performance.now(), alcanza: hip(b) <= PLATAFORMA + 1e-9, avisado: false };
  });

  ajustarTamano();
  requestAnimationFrame(dibujar);
  enviar({ tipo: 'listo' });   // avisa a Storyline que el simulador cargó
})();
</script>
</body>
</html>
